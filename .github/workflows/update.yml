name: 更新定投数据

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "reports/**"
      - "README.md"
  schedule:
    # 每天两次（北京时间 08:30 与 20:30），捕捉最新披露的净值
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dca-update
  cancel-in-progress: false

jobs:
  update:
    name: 抓取净值并重算持仓
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 更新数据
        run: python scripts/update.py

      # 防止「数据已更新但看板/README 没跟上」这类静默不一致
      - name: 校验看板与最新数据一致
        run: |
          stamp=$(sed -n 's/.*"updated_at": "\([0-9-]*\)T\([0-9][0-9]:[0-9][0-9]\).*/\1 \2/p' data/portfolio.json)
          echo "portfolio.json 数据时间 = ${stamp}"
          if [ -z "${stamp}" ]; then
            echo "::error::无法从 data/portfolio.json 解析 updated_at"
            exit 1
          fi
          for f in reports/index.html README.md; do
            if ! grep -q "${stamp} (UTC+8)" "$f"; then
              echo "::error::${f} 未包含最新数据时间戳（期望 ${stamp}）"
              exit 1
            fi
          done
          echo "看板与数据时间戳一致"

      - name: 提交变更
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore(data): 更新定投数据 $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')"
            git push
          fi

  deploy:
    name: 发布看板到 GitHub Pages
    needs: update
    runs-on: ubuntu-latest
    # Pages 站点需在仓库 Settings → Pages 中把 Source 设为 "GitHub Actions" 后才能部署；
    # 未启用时本作业会失败，但不影响上面的数据更新，故设为不阻断。
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 关键：必须显式检出最新 main。
      # update 作业用 GITHUB_TOKEN 推送的提交不会再次触发工作流，
      # 若沿用默认检出（= 触发本次工作流时的旧 SHA），部署上去的看板会永久滞后一次数据更新。
      - name: 检出仓库（取最新 main，包含 update 作业刚提交的数据）
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 上传看板
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
